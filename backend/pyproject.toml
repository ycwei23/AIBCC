[project]
name = "aibcc-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL instance (docker compose up -d db)"]
