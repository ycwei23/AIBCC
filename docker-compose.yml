services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: aibcc
      POSTGRES_PASSWORD: aibcc
      POSTGRES_DB: aibcc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibcc"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aibcc:aibcc@db:5432/aibcc
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  model-service:
    image: nginx:alpine
    ports:
      - "8001:80"
    # Placeholder for VLM / Document AI service (S1)

volumes:
  postgres_data:
